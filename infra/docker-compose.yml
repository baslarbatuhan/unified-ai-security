# Unified AI Security Gateway — Docker compose
# ────────────────────────────────────────────────────────────────────
# Goal: parity with the local dev experience —
#   `docker compose up` should give you exactly what you'd get by
#   running `uvicorn …` and `streamlit run …` side-by-side on the host:
#     - gateway   → http://localhost:8000
#     - dashboard → http://localhost:8501
#     - chroma    → :8001 (host) / :8000 (in-network)
#     - ollama    → :11435 (host) / :11434 (in-network) — optional
#
# Profiles
# --------
#   (default)  → gateway + dashboard + chroma + ollama (CPU)
#   gpu        → adds nvidia runtime to ollama (requires NVIDIA Container Toolkit)
#                Use:  docker compose --profile gpu up
#   no-ollama  → opt out of compose's ollama (e.g. when a host Ollama is already
#                running on :11434). Override OLLAMA_HOST then.
#
# Env file
# --------
# `infra/.env` (see infra/.env.example). The gateway pulls the whole file
# via `env_file:` below, so any KEY=value the user puts there becomes an
# env-var inside the container — no need to enumerate provider-specific
# names in this compose. Targets reference whichever env-var name the
# user chose (`auth.token_env: MY_KEY` / `query_value_env: MY_KEY`).
# Secrets can also be added at runtime via the dashboard's Targets page
# (local vault, no container restart needed).
#
# Compose itself consumes:
#   HF_TOKEN              — Hugging Face Hub auth (BGE-M3 download speed)
#   GATEWAY_URL           — only honoured by the dashboard; defaults to in-network
services:
  gateway:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        TORCH_DEVICE: cpu
    container_name: uais-gateway
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - HF_HOME=/app/.cache/huggingface
      - EMBEDDING_DEVICE=cpu
      # Hafta 15: eager-load the prompt_guard pipeline at FusionEngine
      # init so the first /analyze request doesn't pay the BGE-M3
      # warm-up cost (~11s on CPU) inside its timeout budget.
      - UAIS_WARM_UP_PIPELINES=1
      # Same secret; both names are read by huggingface_hub / transformers
      - HF_TOKEN=${HF_TOKEN:-}
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
    # User-defined secrets: every KEY=value line in infra/.env becomes an
    # env-var in the gateway container. Targets pick them up by name via
    # `auth.token_env: <KEY>` / `query_value_env: <KEY>` — the user owns
    # the naming, no provider is hard-coded here. Missing file is OK
    # (`required: false`) so first-boot before users create .env works.
    env_file:
      - path: .env
        required: false
    volumes:
      - hf_cache:/app/.cache/huggingface
      - gateway_logs:/app/logs
      # Configs stay bound (read-only YAML tweaks expected without rebuild).
      # Source-tree bind mounts live in docker-compose.override.yml (dev only,
      # auto-loaded by `docker compose up`). For reproducible runs use:
      #   docker compose -f docker-compose.yml up
      # which ignores the override and runs image-built code only.
      - ../configs:/app/configs:ro
      # State that the user expects to survive container restarts:
      #   - `runs/` accumulates CSVs, status.json files, runner logs
      #   - `external_eval/targets.yaml` is edited via the dashboard CRUD
      #     and must round-trip across `docker compose down/up`.
      - ../runs:/app/runs
      - ../external_eval/targets.yaml:/app/external_eval/targets.yaml
    depends_on:
      chroma:
        condition: service_started
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    restart: unless-stopped

  # Streamlit dashboard — same image as the gateway (both in requirements.txt),
  # different command + different port. Talks to the gateway over the internal
  # docker network (`gateway:8000`); the host only sees :8501.
  dashboard:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        TORCH_DEVICE: cpu
    container_name: uais-dashboard
    ports:
      - "8501:8501"
    environment:
      # In-network gateway URL — overridden via `infra/.env` if you want
      # the dashboard to talk to a host-side gateway instead.
      - GATEWAY_URL=${GATEWAY_URL:-http://gateway:8000}
      - GATEWAY_TIMEOUT_S=${GATEWAY_TIMEOUT_S:-120}
    volumes:
      # Shared with the gateway: pages 5_results / 7_logs read CSVs from
      # `runs/`, AND page 3_run_test writes a snapshot to
      # `runs/<run_id>/config_used.yaml` before POSTing to /runs/start
      # (utils/config_builder.write_snapshot). Must be writable.
      # targets.yaml stays read-only — CRUD goes through the gateway API.
      - ../runs:/app/runs
      - ../external_eval/targets.yaml:/app/external_eval/targets.yaml:ro
    command:
      - streamlit
      - run
      - dashboard/app.py
      - --server.port=8501
      - --server.address=0.0.0.0
      - --server.headless=true
      - --browser.gatherUsageStats=false
    depends_on:
      - gateway
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  chroma:
    image: chromadb/chroma:latest
    container_name: uais-chroma
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    restart: unless-stopped

  # Ollama runs **CPU-only** by default so this compose works on every
  # machine, including laptops without an NVIDIA GPU. The official
  # ollama/ollama image falls back to CPU inference when no GPU device
  # is exposed — slower (~10× for a 7B model) but functional.
  #
  # To enable GPU acceleration, layer the GPU override on top:
  #     docker compose \
  #       -f docker-compose.yml \
  #       -f docker-compose.override.yml \
  #       -f docker-compose.gpu.yml \
  #       up
  # That file adds `runtime: nvidia` + the device reservation. Requires
  # the NVIDIA Container Toolkit on the host.
  ollama:
    image: ollama/ollama:latest
    container_name: uais-ollama
    ports:
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  # Open WebUI — a self-hosted ChatGPT-style chat interface, used here as
  # a concrete *web target* (Sprint 8). It talks to the existing `ollama`
  # service over the internal network, so no paid API key is needed.
  #
  # The WebAdapter (Playwright) probes this UI at http://open-webui:8080
  # from inside the gateway container; the host sees it on :3000.
  #
  # W1 ships with WEBUI_AUTH=False so the first selector-discovery +
  # probe pass has no login/cookie friction. Flip it to True later
  # (Sprint 8 W4) to exercise the cookie / storage_state auth path.
  #
  # Model note: this service does NOT pull a model. Open WebUI surfaces
  # whatever the shared `ollama_data` volume already holds (the LLM judge
  # uses qwen2.5:7b, so a model is usually present). If the model list is
  # empty, pull one once: `docker exec uais-ollama ollama pull qwen2.5:3b`.
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: uais-open-webui
    ports:
      - "3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_AUTH=True
      - ENABLE_API_KEYS=True
      - ENABLE_SIGNUP=False
      - ENABLE_LOGIN_FORM=True
    volumes:
      - open_webui_data:/app/backend/data
    depends_on:
      ollama:
        condition: service_started
    restart: unless-stopped

  # Sandbox container for isolated tool execution
  sandbox:
    profiles: ["sandbox"]
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        TORCH_DEVICE: cpu
    container_name: uais-sandbox
    entrypoint: ["python", "-c", "import time; time.sleep(999999)"]
    network_mode: "none"
    read_only: true
    tmpfs:
      - /tmp:size=64M
    mem_limit: 256m
    cpus: 0.5
    security_opt:
      - no-new-privileges:true
    restart: "no"

volumes:
  chroma_data:
  ollama_data:
  hf_cache:
  gateway_logs:
  open_webui_data:
